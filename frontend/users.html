<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Sistema de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="auth.js"></script>
</head>
<body>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3 border-0">
                <h5 id="form-title">Nuevo Usuario</h5>
                <div class="mb-2"><label>Username</label><input id="u-name" class="form-control"></div>
                <div class="mb-2"><label>Password</label><input type="password" id="u-pass" class="form-control"></div>
                <div class="mb-3">
                    <label>Rol</label>
                    <select id="u-role" class="form-select">
                        <option value="cajero">Cajero</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="saveUser()" id="save-btn" class="btn btn-primary w-100">Crear Usuario</button>
                    <button onclick="resetForm()" id="cancel-btn" class="btn btn-outline-secondary d-none">Cancelar</button>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card p-3 border-0">
                <h5>Lista de Usuarios</h5>
                <table class="table mt-2 align-middle">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="user-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        initAppShell({
            activePage: "users.html",
            title: "Usuarios",
            subtitle: "Administración de accesos y roles.",
            requiredRole: "admin",
        });

        let editingUserId = null;

        function resetForm() {
            editingUserId = null;
            document.getElementById("form-title").textContent = "Nuevo Usuario";
            document.getElementById("save-btn").textContent = "Crear Usuario";
            document.getElementById("cancel-btn").classList.add("d-none");
            document.getElementById("u-name").value = "";
            document.getElementById("u-pass").value = "";
            document.getElementById("u-role").value = "cajero";
        }

        async function saveUser() {
            const user = {
                username: document.getElementById("u-name").value.trim(),
                password: document.getElementById("u-pass").value,
                role: document.getElementById("u-role").value,
            };

            if (!user.username) {
                alert("Debes ingresar un nombre de usuario.");
                return;
            }

            if (!editingUserId && !user.password) {
                alert("Debes ingresar una contraseña.");
                return;
            }

            const path = editingUserId ? `/users/${editingUserId}` : "/users";
            const method = editingUserId ? "PUT" : "POST";
            const payload = editingUserId
                ? { username: user.username, role: user.role, password: user.password || null }
                : user;

            const response = await apiFetch(path, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                alert(errorData.detail || "No fue posible guardar el usuario.");
                return;
            }

            resetForm();
            loadUsers();
        }

        function startEditUser(id) {
            const user = window.usersCache.find((item) => item.id === id);
            if (!user) return;

            editingUserId = id;
            document.getElementById("form-title").textContent = "Editar Usuario";
            document.getElementById("save-btn").textContent = "Guardar Cambios";
            document.getElementById("cancel-btn").classList.remove("d-none");
            document.getElementById("u-name").value = user.username;
            document.getElementById("u-pass").value = "";
            document.getElementById("u-role").value = user.role;
        }

        async function deleteUser(id) {
            if (!confirm("¿Seguro que quieres eliminar este usuario?")) return;

            const response = await apiFetch(`/users/${id}`, { method: "DELETE" });
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                alert(errorData.detail || "No fue posible eliminar el usuario.");
                return;
            }

            if (editingUserId === id) resetForm();
            loadUsers();
        }

        async function loadUsers() {
            const response = await apiFetch("/users");
            const data = await response.json();
            window.usersCache = data;
            document.getElementById("user-list").innerHTML = data.map((user) => `
                <tr>
                    <td>${user.username}</td>
                    <td>${user.role}</td>
                    <td>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="startEditUser(${user.id})">Editar</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})">Eliminar</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }

        resetForm();
        loadUsers();
    </script>
</body>
</html>
