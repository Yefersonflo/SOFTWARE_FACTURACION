<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gastos - Sistema de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="auth.js"></script>
</head>
<body>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3 border-0">
                <h5>Registrar Gasto</h5>
                <div class="mb-2">
                    <label>Tipo</label>
                    <select id="e-type" class="form-select">
                        <option value="servicio">Servicio</option>
                        <option value="proveedor">Proveedor</option>
                        <option value="empleado">Empleado</option>
                    </select>
                </div>
                <div class="mb-2"><label>Monto</label><input type="number" id="e-amount" class="form-control"></div>
                <div class="mb-3"><label>Descripción</label><textarea id="e-desc" class="form-control"></textarea></div>
                <button onclick="saveExpense()" class="btn btn-warning w-100">Guardar Gasto</button>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card p-3 border-0">
                <h5>Lista de Gastos</h5>
                <table class="table">
                    <thead><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Descripción</th></tr></thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        initAppShell({
            activePage: "expenses.html",
            title: "Gastos",
            subtitle: "Control administrativo de egresos.",
            requiredRole: "admin",
        });

        async function saveExpense() {
            const expense = {
                type: document.getElementById("e-type").value,
                amount: parseFloat(document.getElementById("e-amount").value),
                description: document.getElementById("e-desc").value,
            };

            const response = await apiFetch("/expenses", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(expense),
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                alert(errorData.detail || "No fue posible registrar el gasto.");
                return;
            }

            location.reload();
        }

        async function loadExpenses() {
            const response = await apiFetch("/expenses");
            const data = await response.json();
            document.getElementById("expense-list").innerHTML = data.map((expense) => `
                <tr>
                    <td>${expense.date.split("T")[0]}</td>
                    <td>${expense.type}</td>
                    <td>$${expense.amount}</td>
                    <td>${expense.description}</td>
                </tr>
            `).join("");
        }

        loadExpenses();
    </script>
</body>
</html>
