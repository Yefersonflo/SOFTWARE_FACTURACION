<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Completo - Sistema de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="auth.js"></script>
</head>
<body>
    <div class="d-flex justify-content-end mb-3">
        <button onclick="downloadExcel()" class="btn btn-success">Descargar Excel</button>
    </div>

    <div class="row g-4">
        <div class="col-xl-4">
            <div class="card border-0">
                <div class="card-body">
                    <h4 id="product-form-title" class="card-title">Editar Producto</h4>
                    <p class="text-muted mb-3">Selecciona un producto de la tabla para editarlo.</p>
                    <div class="mb-2">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="p-name" class="form-control" disabled>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Código</label>
                        <input type="text" id="p-barcode" class="form-control" disabled>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-2">
                            <label class="form-label">P. Compra</label>
                            <input type="number" id="p-purchase" class="form-control" step="0.01" disabled>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label">P. Venta</label>
                            <input type="number" id="p-sale" class="form-control" step="0.01" disabled>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" id="p-stock" class="form-control" disabled>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Stock mínimo</label>
                            <input type="number" id="p-min-stock" class="form-control" disabled>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button onclick="saveProduct()" id="product-save-btn" class="btn btn-primary w-100" disabled>Guardar Cambios</button>
                        <button onclick="resetProductForm()" class="btn btn-outline-secondary">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-8">
            <div class="card border-0">
                <div class="card-body">
                    <h4 class="card-title">Inventario de Productos</h4>
                    <div class="input-group my-3">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="filter" onkeyup="filterTable()" class="form-control" placeholder="Buscar por nombre o código...">
                    </div>
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Código</th>
                                <th>Precio Compra</th>
                                <th>Precio Venta</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="p-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        initAppShell({
            activePage: "products_list.html",
            title: "Inventario",
            subtitle: "Consulta, edición y eliminación de productos.",
            requiredRole: "admin",
        });

        let products = [];
        let editingProductId = null;

        function setFormEnabled(enabled) {
            ["p-name", "p-barcode", "p-purchase", "p-sale", "p-stock", "p-min-stock"].forEach((id) => {
                document.getElementById(id).disabled = !enabled;
            });
            document.getElementById("product-save-btn").disabled = !enabled;
        }

        function resetProductForm() {
            editingProductId = null;
            document.getElementById("product-form-title").textContent = "Editar Producto";
            document.getElementById("p-name").value = "";
            document.getElementById("p-barcode").value = "";
            document.getElementById("p-purchase").value = "";
            document.getElementById("p-sale").value = "";
            document.getElementById("p-stock").value = "";
            document.getElementById("p-min-stock").value = "";
            setFormEnabled(false);
        }

        async function loadData() {
            const response = await apiFetch("/products");
            products = await response.json();
            renderTable(products);
        }

        function renderTable(data) {
            const table = document.getElementById("p-table");
            table.innerHTML = data.map((product) => `
                <tr>
                    <td><strong>${product.name}</strong></td>
                    <td><code>${product.barcode}</code></td>
                    <td>$ ${Number(product.purchase_price).toFixed(2)}</td>
                    <td>$ ${Number(product.sale_price).toFixed(2)}</td>
                    <td>${product.stock}</td>
                    <td><span class="badge ${product.stock <= product.min_stock ? "bg-danger" : "bg-success"}">${product.stock <= product.min_stock ? "Bajo" : "OK"}</span></td>
                    <td>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="startEditProduct(${product.id})">Editar</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})">Eliminar</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }

        function filterTable() {
            const query = document.getElementById("filter").value.toLowerCase();
            const filtered = products.filter((product) =>
                product.name.toLowerCase().includes(query) || product.barcode.includes(query)
            );
            renderTable(filtered);
        }

        function startEditProduct(id) {
            const product = products.find((item) => item.id === id);
            if (!product) return;

            editingProductId = id;
            document.getElementById("product-form-title").textContent = `Editar Producto: ${product.name}`;
            setFormEnabled(true);
            document.getElementById("p-name").value = product.name;
            document.getElementById("p-barcode").value = product.barcode;
            document.getElementById("p-purchase").value = product.purchase_price;
            document.getElementById("p-sale").value = product.sale_price;
            document.getElementById("p-stock").value = product.stock;
            document.getElementById("p-min-stock").value = product.min_stock;
        }

        async function saveProduct() {
            if (!editingProductId) {
                alert("Primero selecciona un producto para editar.");
                return;
            }

            const payload = {
                name: document.getElementById("p-name").value.trim(),
                barcode: document.getElementById("p-barcode").value.trim(),
                purchase_price: parseFloat(document.getElementById("p-purchase").value),
                sale_price: parseFloat(document.getElementById("p-sale").value),
                stock: parseInt(document.getElementById("p-stock").value, 10),
                min_stock: parseInt(document.getElementById("p-min-stock").value, 10),
            };

            if (!payload.name || !payload.barcode) {
                alert("Debes completar nombre y código.");
                return;
            }

            if (Number.isNaN(payload.purchase_price) || Number.isNaN(payload.sale_price) || Number.isNaN(payload.stock) || Number.isNaN(payload.min_stock)) {
                alert("Debes completar precios y stock con valores válidos.");
                return;
            }

            const response = await apiFetch(`/products/${editingProductId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                alert(errorData.detail || "No fue posible guardar el producto.");
                return;
            }

            resetProductForm();
            loadData();
        }

        async function deleteProduct(id) {
            if (!confirm("¿Seguro que quieres eliminar este producto?")) return;
            const response = await apiFetch(`/products/${id}`, { method: "DELETE" });
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                alert(errorData.detail || "No fue posible eliminar el producto.");
                return;
            }

            if (editingProductId === id) resetProductForm();
            loadData();
        }

        function downloadExcel() {
            downloadFile("/products/excel", "inventario_supermercado.xlsx").catch((error) => {
                alert(error.message);
            });
        }

        resetProductForm();
        loadData();
    </script>
</body>
</html>
