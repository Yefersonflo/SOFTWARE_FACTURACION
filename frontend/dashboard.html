<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Facturación - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="auth.js"></script>
</head>

<body>
    <div class="row g-4 admin-only">
        <div class="col-md-4">
            <div class="card p-3 border-0">
                <h6 class="text-muted">Ganancias Totales</h6>
                <h3 id="sales-count">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 border-0">
                <h6 class="text-muted">Ingresos</h6>
                <h3 id="income-sum">$ 0.00</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 border-0">
                <h6 class="text-muted">Stock Bajo</h6>
                <h3 id="low-stock">0</h3>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <div class="card p-4 border-0">
            <h4 class="mb-3">Accesos Rápidos</h4>
            <div class="d-flex flex-wrap gap-3" id="quick-actions"></div>
        </div>
    </div>

    <script>
        const session = initAppShell({
            activePage: "dashboard.html",
            title: "Resumen General",
            subtitle: "Panel principal del sistema.",
        });

        if (session) {
            const quickActions = document.getElementById("quick-actions");
            quickActions.innerHTML = `
                <a href="billing.html" class="btn btn-primary btn-lg p-4">
                    Nueva Venta
                </a>
                ${session.role === "admin" ? `
                    <a href="calendar.html" class="btn btn-info btn-lg p-4 text-white">
                        Ver Calendario
                    </a>
                ` : ""}
            `;

            if (session.role === "admin") {
                document.querySelectorAll(".admin-only").forEach((el) => {
                    el.style.display = "flex";
                });
                loadStats();
            } else {
                document.querySelectorAll(".admin-only").forEach((el) => {
                    el.style.display = "none";
                });
            }
        }

        async function loadStats() {
            const res = await apiFetch("/stats");
            if (!res.ok) return;
            const stats = await res.json();
            document.getElementById("sales-count").innerText = stats.total_sales;
            document.getElementById("income-sum").innerText = "$ " + Number(stats.sum_income).toLocaleString();
            document.getElementById("low-stock").innerText = stats.low_stock_count;
        }
    </script>
</body>

</html>
