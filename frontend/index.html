<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 40px; border-radius: 16px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4 fw-bold text-primary">Supermercado</h2>
        <p class="text-center text-muted mb-4">Ingrese sus credenciales</p>
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control form-control-lg" placeholder="admin">
        </div>
        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••">
        </div>
        <button onclick="login()" class="btn btn-primary btn-lg w-100 shadow-sm">Iniciar Sesión</button>
        <div id="error" class="text-danger mt-3 text-center" style="display:none; font-weight: 500;"></div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', data.username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.innerText = data.detail || 'Usuario o contraseña incorrectos';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Servidor fuera de línea';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
